name: Repository checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Select the newest stable Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' |
            grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
      - name: Check repository
        run: bin/check --full
