name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Select the newest stable Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' |
            grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
      - name: Check repository
        run: bin/check --full
